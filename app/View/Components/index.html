<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Note App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container mt-5">
    <div class="col-md-4 mx-auto">
        <h3 class="text-center">Login</h3>
        <input type="email" class="form-control mt-3" placeholder="Email">
        <input type="password" class="form-control mt-2" placeholder="Password">
        <button class="btn btn-primary w-100 mt-3" onclick="login()">Login</button>
    </div>
</div>

<!-- APP -->
<div id="appPage" class="hidden">

    <div class="d-flex">

        <!-- SIDEBAR -->
        <div class="sidebar col-2 p-3">
            <h5>Notes</h5>

            <div class="nav-item">
                <i data-lucide="notebook"></i> All Notes
            </div>

            <div class="nav-item">
                <i data-lucide="pin"></i> Pinned
            </div>

            <div class="nav-item">
                <i data-lucide="share-2"></i> Shared
            </div>

            <hr>

            <h6>Labels</h6>
            <div id="labelList"></div>

            <button class="btn btn-sm btn-light mt-2 w-100" onclick="addLabel()">+ Add Label</button>
        </div>

        <!-- MAIN -->
        <div class="col-10">

            <div class="topbar glass d-flex justify-content-between align-items-center">
                <input id="search" class="form-control w-50" placeholder="🔍 Search notes..." onkeyup="searchNotes()">

                <div>
                    <button class="btn btn-light me-2" onclick="toggleView()">
                        <i class="bi bi-grid"></i>
                    </button>

                    <button class="btn btn-primary" onclick="openEditor()">
                        <i class="bi bi-plus-lg"></i> New
                    </button>
                </div>
            </div>

            <div class="container mt-3">
                <div id="notesContainer" class="row"></div>
            </div>

        </div>
    </div>
</div>

<!-- NOTE MODAL -->
<div class="modal fade" id="noteModal">
    <div class="modal-dialog">
        <div class="modal-content p-3">

            <input id="noteTitle" class="form-control mb-2" placeholder="Title">
            <textarea id="noteContent" class="form-control" rows="5"></textarea>

            <div class="mt-2">
                <button class="btn btn-sm btn-outline-primary" onclick="togglePin()">📌 Pin</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="attachLabel()">🏷 Label</button>
            </div>

            <div id="saveStatus" class="save-status mt-2"></div>

            <button class="btn btn-danger mt-3" onclick="deleteNote()">Delete</button>

        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
